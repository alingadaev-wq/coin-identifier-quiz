<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Coin Identifier - Guess the Value (Mintegral)</title>
<!-- Mintegral playable: fully self-contained, MRAID-based. No external resources required. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#03060a;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;overscroll-behavior:none}

  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%,rgba(63,240,196,.16) 0%,rgba(63,240,196,0) 55%),
      radial-gradient(rgba(63,240,196,.12) 1px,transparent 1.4px) 0 0/24px 24px,
      linear-gradient(160deg,#0c1e2a 0%,#071018 55%,#03060a 100%)}
  .glowblob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 11s ease-in-out infinite}
  .g1{width:280px;height:280px;background:#3FF0C4;top:-90px;right:-80px}
  .g2{width:240px;height:240px;background:#FFA53C;bottom:-70px;left:-70px;animation-delay:-4s}
  @keyframes drift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.07)}}

  .phone{position:relative;width:100%;height:100%;background:#03060a;overflow:hidden;z-index:2}
  .screen{position:absolute;inset:0;overflow:hidden}
  @media (min-width:560px){
    .phone{width:min(80vw,300px);aspect-ratio:9/19.5;border-radius:44px;
      box-shadow:0 0 0 11px #10151f,0 0 0 13px #1b2230,0 40px 80px rgba(0,0,0,.65)}
    .screen{border-radius:34px}
  }

  .topbar{position:absolute;top:0;left:0;right:0;z-index:20;padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:7px;color:#8FEAD1;font-size:12px;font-weight:900;letter-spacing:.3px}
  .brand svg{width:16px;height:16px;flex:0 0 auto}
  .dots{display:flex;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .3s,transform .3s}
  .dot.done{background:#3FF0C4}
  .dot.active{background:#3FF0C4;transform:scale(1.3)}

  .quizwrap{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;padding:64px 20px 22px}
  .quizwrap.on{display:flex}
  .qlabel{color:#7C93A3;font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
  .qtitle{color:#fff;font-size:17px;font-weight:900;text-align:center;line-height:1.28;margin-top:6px;padding:0 4px}

  .photocard{position:relative;width:min(62vw,220px);aspect-ratio:1/1;border-radius:26px;overflow:hidden;margin-top:16px;
    border:1px solid rgba(63,240,196,.22);box-shadow:0 18px 40px rgba(0,0,0,.55);background:#0c1e2a;flex:0 0 auto}
  .photocard img{width:100%;height:100%;object-fit:cover;display:block}
  .photocard .ring{position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 0 0 1px rgba(63,240,196,.15)}
  .photocard.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  .photocard.pulse{animation:pulse .5s ease}
  @keyframes pulse{0%{box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 0 rgba(51,255,176,.5)}100%{box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 18px rgba(51,255,176,0)}}

  .answers{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .ans{position:relative;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:13px 16px;color:#fff;font-size:15px;font-weight:800;text-align:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,border-color .2s,transform .15s}
  .ans:active{transform:scale(.97)}
  .ans.correct{background:rgba(51,255,176,.16);border-color:#33FFB0;color:#33FFB0}
  .ans.wrong{background:rgba(255,92,92,.14);border-color:#FF5C5C;color:#FF9B9B}
  .ans.dim{opacity:.45}
  .ans .mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0}
  .ans.correct .mark,.ans.wrong .mark{opacity:1}

  .resultbar{width:100%;max-width:320px;margin-top:14px;padding:12px 16px;border-radius:14px;text-align:center;
    background:rgba(63,240,196,.08);border:1px solid rgba(63,240,196,.22);opacity:0;transform:translateY(8px);
    transition:opacity .3s,transform .3s}
  .resultbar.show{opacity:1;transform:translateY(0)}
  .resultbar .rtitle{font-size:13.5px;font-weight:900;color:#fff}
  .resultbar .rsub{font-size:11.5px;font-weight:700;color:#8FEAD1;margin-top:3px;line-height:1.4}

  .hand{position:absolute;width:34px;z-index:28;pointer-events:none;opacity:0;
    transition:opacity .25s,left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1);
    filter:drop-shadow(0 4px 7px rgba(0,0,0,.6));animation:handbob 1.05s ease-in-out infinite}
  .hand.show{opacity:1}
  @keyframes handbob{0%,100%{transform:translate(-26%,0)}50%{transform:translate(-26%,-9px)}}

  .spark{position:absolute;border-radius:50%;pointer-events:none;z-index:30;
    background:radial-gradient(circle,#fff 0%,#3FF0C4 45%,rgba(63,240,196,0) 72%)}

  /* ---------- INTRO ---------- */
  #intro{position:absolute;inset:0;z-index:40;overflow:hidden;background:#03060a;transition:opacity .5s}
  #intro.gone{opacity:0;pointer-events:none}
  .iscene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;padding:0 26px;text-align:center}
  .iscene.on{opacity:1}
  #introIcon{width:64px;height:64px;border-radius:18px;margin-bottom:16px;box-shadow:0 14px 30px rgba(63,240,196,.25);position:relative;overflow:hidden;transform:scale(.6);opacity:0}
  #introIcon.in{animation:iconpop .5s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes iconpop{to{opacity:1;transform:scale(1)}}
  #introH{color:#fff;font-size:clamp(21px,6.4vw,26px);font-weight:900;line-height:1.26;opacity:0;transform:translateY(10px)}
  #introH.in{animation:textup .45s forwards}
  @keyframes textup{to{opacity:1;transform:translateY(0)}}
  #introH em{color:#3FF0C4;font-style:normal}
  #introSub{color:#8FEAD1;font-size:13px;font-weight:700;margin-top:10px;opacity:0}
  #introSub.in{animation:textup .45s .1s forwards}
  .startbtn{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);border:none;cursor:pointer;
    background:linear-gradient(90deg,#00C98F,#3FF0C4);color:#04241a;font-size:16px;font-weight:900;
    padding:14px 34px;border-radius:40px;box-shadow:0 10px 26px rgba(0,201,143,.4);opacity:0;pointer-events:none;white-space:nowrap}
  .startbtn.show{opacity:1;pointer-events:auto;animation:btnpulse 1.4s infinite}
  @keyframes btnpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  .skip{position:absolute;bottom:13px;right:12px;z-index:42;background:rgba(6,14,22,.6);color:#fff;font-size:11px;font-weight:800;border:none;padding:5px 12px;border-radius:20px;cursor:pointer}
  .mute{position:absolute;bottom:12px;left:12px;z-index:42;width:28px;height:28px;border:none;border-radius:50%;background:rgba(6,14,22,.6);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hide{opacity:0!important;pointer-events:none;transition:opacity .4s}

  /* ---------- END / SCORE ---------- */
  .endcard{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 10%,#123244 0%,#0c1e2a 50%,#03060a 100%);
    opacity:0;pointer-events:none;transition:opacity .5s}
  .endcard.show{opacity:1;pointer-events:auto}
  .scoreRow{display:flex;gap:14px;margin-bottom:6px}
  .scoreCoin{width:56px;height:56px;border-radius:14px;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.14)}
  .scoreCoin img{width:100%;height:100%;object-fit:cover;display:block}
  .scoreCoin .badge{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-radius:50% 0 0 0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
  .scoreCoin.right .badge{background:#33FFB0;color:#04241a}
  .scoreCoin.wrong .badge{background:#FF5C5C;color:#2a0505}
  .endcard h2{color:#fff;font-size:22px;font-weight:900;line-height:1.2;margin-top:10px}
  .endcard h2 span{color:#3FF0C4}
  .endcard p{color:#8FEAD1;font-size:12.5px;font-weight:600;margin-top:9px;max-width:270px;line-height:1.55}
  .trustrow{display:flex;gap:16px;margin-top:14px}
  .trustrow div{display:flex;flex-direction:column;align-items:center;color:#7C93A3;font-size:9.5px;font-weight:800}
  .trustrow b{color:#fff;font-size:14px;font-weight:900}
  .cta{position:relative;overflow:hidden;margin-top:17px;width:min(84%,262px);background:linear-gradient(90deg,#00C98F,#3FF0C4);color:#04241a;
    font-size:17.5px;font-weight:900;padding:15px;border-radius:15px;border:none;cursor:pointer;box-shadow:0 12px 30px rgba(0,201,143,.45);animation:ctapulse 1.5s infinite}
  .cta::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
    transform:skewX(-18deg);animation:ctashine 2.6s ease-in-out infinite;animation-delay:1.8s}
  @keyframes ctashine{0%,30%{left:-70%}68%,100%{left:130%}}
  @keyframes ctapulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .cta.small{margin-top:9px;background:none;box-shadow:none;color:#7C93A3;font-size:12px;font-weight:700;padding:6px;animation:none}
  .cta.small::after{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="glowblob g1"></div><div class="glowblob g2"></div>

  <div class="phone"><div class="screen" id="screen">

    <div class="topbar" id="topbar" style="opacity:0">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#3FF0C4" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5-1.3 2-3 2.5-3 1.1-3 2.5 1.3 2.5 3 2.5 3-1.1 3-2.5"/></svg>Coin IQ</div>
      <div class="dots" id="dots"><div class="dot" data-i="0"></div><div class="dot" data-i="1"></div></div>
    </div>

    <div class="quizwrap" id="quizWrap">
      <div class="qlabel" id="qLabel">ROUND 1 OF 2</div>
      <div class="qtitle" id="qTitle"></div>
      <div class="photocard" id="photoCard"><img id="photoImg" src="" alt=""><div class="ring"></div></div>
      <div class="answers" id="answers"></div>
      <div class="resultbar" id="resultBar"><div class="rtitle" id="rTitle"></div><div class="rsub" id="rSub"></div></div>
    </div>

    <img class="hand" id="hand" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 60'><path d='M18 4c0-2 4-2 4 0v22l4-6c1-2 5 0 4 2l-2 6h6c3 0 6 2 6 6v10c0 6-4 12-12 12H22c-5 0-8-3-10-7L6 40c-1-2 2-5 4-3l4 4V4z' fill='white' stroke='%23052018' stroke-width='1.8'/></svg>">

    <div id="intro">
      <div class="iscene on" id="sc1">

        <div id="introH">Think you know <em>coin values</em>? 🤔</div>
        <div id="introSub">2 real coins. Guess right — or find out.</div>
      </div>
      <button class="startbtn" id="startBtn">▶ Start the quiz</button>
      <button class="skip" id="skipBtn">Skip ▶</button>
    </div>

    <button class="mute" id="muteBtn" title="sound">🔊</button>

    <div class="endcard" id="endcard">
      <div class="scoreRow" id="scoreRow"></div>
      <h2 id="scoreH2">You got <span id="scoreNum">0/2</span> right</h2>
      <p>There's no guessing with Coin Identifier — point your camera at any coin and get its real value instantly.</p>
      <div class="trustrow"><div><b>50M+</b>coins scanned</div><div><b>Instant</b>identification</div><div><b>Free</b>no signup</div></div>
      <button class="cta" id="ctaBtn">&#9654; Scan My Coins Now</button>
      <button class="cta small" id="retryBtn">&#8635; Try again</button>
    </div>

  </div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const screenEl=$('screen'), intro=$('intro'), endcard=$('endcard'), hand=$('hand'), topbar=$('topbar');
let timers=[];
function T(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

function onTap(el,fn){
  if(window.PointerEvent){ el.addEventListener('pointerdown',e=>{ if(e.cancelable) e.preventDefault(); fn(e); }); return; }
  let last=0; const h=e=>{ const now=Date.now(); if(now-last<400) return; last=now;
    if(e&&e.cancelable) e.preventDefault(); fn(e); };
  el.addEventListener('touchstart',h,{passive:false}); el.addEventListener('click',h);
}
function pointAt(el,dy){ if(!el) return; const r=el.getBoundingClientRect(), s=screenEl.getBoundingClientRect();
  const x=r.left+r.width*0.62-s.left, y=r.top+r.height*0.55-s.top+(dy||0);
  hand.style.left=x+'px'; hand.style.top=y+'px'; hand.classList.add('show'); }
function hidePointer(){ hand.classList.remove('show'); }

/* Two real, public-domain coin photos (National Numismatic Collection, Smithsonian NMAH — US Mint coins
   are US-government works, ineligible for copyright). Answer options are shuffled per-play. */
const ROUNDS = [
  {
    img: PENNY_IMG,
    q: 'How much is this 1943 steel Lincoln cent really worth?',
    options: ['$0.05', '$0.28 – $0.65', '$3,000'],
    correct: 1,
    rightSub: "That's its real price range in worn condition.",
    wrongSub: 'The real range is $0.28 – $0.65 — close, but not quite.'
  },
  {
    img: NICKEL_IMG,
    q: 'This 1913 Buffalo Nickel is in worn (VF) condition. What’s it worth?',
    options: ['$5', '$68', '$960'],
    correct: 1,
    rightSub: 'In perfect Mint State, the same coin sells for $960.',
    wrongSub: 'It’s actually worth $68 in this condition — $960 is only for a perfect Mint State example.'
  }
];

let round=0, score=0, answered=false;

function buildRound(i){
  answered=false;
  const r = ROUNDS[i];
  $('qLabel').textContent = 'ROUND ' + (i+1) + ' OF ' + ROUNDS.length;
  $('qTitle').textContent = r.q;
  $('photoImg').src = r.img;
  $('photoCard').className = 'photocard';
  $('resultBar').className = 'resultbar';
  document.querySelectorAll('.dot').forEach((d,di)=>{ d.classList.toggle('active', di===i); d.classList.toggle('done', di<i); });

  const wrap = $('answers'); wrap.innerHTML='';
  r.options.forEach((opt,oi)=>{
    const b = document.createElement('button');
    b.className='ans'; b.textContent=opt;
    const mark=document.createElement('span'); mark.className='mark'; b.appendChild(mark);
    onTap(b, ()=>selectAnswer(i,oi,b));
    wrap.appendChild(b);
  });
  T(()=>{ if(!answered) pointAt(wrap.children[0]); },900);
}

let roundResults=[];
function selectAnswer(i,oi,btn){
  if(answered) return; answered=true; hidePointer();
  const r = ROUNDS[i];
  const buttons=[...document.querySelectorAll('.ans')];
  const isRight = oi===r.correct;
  roundResults[i] = isRight;
  buttons.forEach((b,bi)=>{
    if(bi===r.correct) b.classList.add('correct');
    else if(bi===oi) b.classList.add('wrong');
    else b.classList.add('dim');
    b.querySelector('.mark').textContent = bi===r.correct ? '✓' : (bi===oi ? '✗' : '');
  });
  const card=$('photoCard');
  if(isRight){ score++; card.classList.add('pulse'); sfxWin(); confettiAt(card); }
  else { card.classList.add('shake'); sfxWrong(); }
  $('rTitle').textContent = isRight ? '✓ Correct!' : '✗ Not quite';
  $('rSub').textContent = isRight ? r.rightSub : r.wrongSub;
  $('resultBar').classList.add('show');
  T(()=>{ if(i+1<ROUNDS.length){ round=i+1; buildRound(round); } else { showEnd(); } }, 2600);
}

function confettiAt(el){ const rect=el.getBoundingClientRect();
  const cols=['#3FF0C4','#FFA53C','#33FFB0','#EAFBF5'];
  for(let k=0;k<16;k++){ const p=document.createElement('div'); p.style.position='fixed'; p.style.width='7px'; p.style.height='7px';
    p.style.borderRadius='50%'; p.style.zIndex=60; p.style.background=cols[k%cols.length];
    p.style.left=(rect.left+rect.width/2)+'px'; p.style.top=(rect.top+rect.height/2)+'px'; document.body.appendChild(p);
    const a=Math.random()*Math.PI*2, d=50+Math.random()*110;
    p.style.transition='transform .9s cubic-bezier(.2,.7,.3,1),opacity .9s';
    requestAnimationFrame(()=>{ p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*360}deg)`; p.style.opacity='0'; });
    setTimeout(()=>p.remove(),950); }
}

function showEnd(){
  $('quizWrap').classList.remove('on'); topbar.style.opacity='0';
  $('scoreNum').textContent = score + '/' + ROUNDS.length;
  const row=$('scoreRow'); row.innerHTML='';
  ROUNDS.forEach((r,i)=>{
    const ok = roundResults[i];
    const d=document.createElement('div'); d.className='scoreCoin '+(ok?'right':'wrong');
    d.innerHTML = `<img src="${r.img}" alt=""><div class="badge">${ok?'✓':'✗'}</div>`;
    row.appendChild(d);
  });
  endcard.classList.add('show');
}

/* dismissIntro is a one-time idempotent gate (start/skip/auto-timer can all fire);
   startQuiz is the round-reset logic and must be able to run again on retry. */
let introGone=false;
function dismissIntro(){ if(introGone) return; introGone=true;
  clearTimers(); intro.classList.add('gone'); $('skipBtn').classList.add('hide');
  T(()=>intro.style.display='none',520);
  topbar.style.transition='opacity .3s'; topbar.style.opacity='1';
  startQuiz();
}
function startQuiz(){
  round=0; score=0; roundResults=[];
  $('quizWrap').classList.add('on');
  buildRound(0);
}
$('startBtn').addEventListener('click',dismissIntro);
$('skipBtn').addEventListener('click',dismissIntro);
$('retryBtn').addEventListener('click',()=>{ if(endLocked()) return; endcard.classList.remove('show'); clearTimers(); startQuiz(); });
$('ctaBtn').addEventListener('click',()=>{ if(endLocked()) return; $('ctaBtn').textContent='Opening… ▶'; downloadApp(); });
let endShownAt=0;
function endLocked(){ return Date.now()-endShownAt<800; }
function downloadApp(){ try{
    if(typeof mraid!=='undefined'&&mraid.open){ mraid.open(); return; }
    if(typeof ExitApi!=='undefined'&&ExitApi.exit){ ExitApi.exit(); return; }
    if(typeof FbPlayableAd!=='undefined'){ FbPlayableAd.onCTAClick(); return; }
  }catch(e){}
  window.open('https://play.google.com/store/apps/details?id=YOUR.APP.PACKAGE','_blank'); }

/* ---------------- SOUND ---------------- */
let actx,master,soundOn=true,started=false;
const OK=()=>actx&&actx.state==='running';
function initAudio(){ if(started) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  started=true;
  try{ const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0);}catch(e){}
  if(actx.resume) actx.resume().catch(()=>{});
  master=actx.createGain(); master.connect(actx.destination);
  master.gain.setValueAtTime(0.0001,actx.currentTime); master.gain.exponentialRampToValueAtTime(0.55,actx.currentTime+0.05); }
function unlock(){ if(!started) initAudio(); else if(actx&&actx.state==='suspended') actx.resume().catch(()=>{}); }
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlock,{passive:true}));
function tone(f0,f1,t,dur,type,vol){ if(!OK())return; const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur*0.9);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); }
function noise(t,dur,cut,vol,type){ if(!OK())return; const n=Math.floor(actx.sampleRate*dur);
  const b=actx.createBuffer(1,Math.max(1,n),actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(); s.buffer=b; const f=actx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=cut;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02); }
function sfxTick(){ if(!OK())return; const t=actx.currentTime; tone(760,540,t,0.06,'triangle',0.16); }
function sfxWin(){ if(!OK())return; const t=actx.currentTime; [523,659,784,1047].forEach((f,i)=>tone(f,f,t+i*0.08,0.34,'triangle',0.15)); }
function sfxWrong(){ if(!OK())return; const t=actx.currentTime; tone(320,140,t,0.28,'sawtooth',0.12); noise(t,0.15,1200,0.08); }
$('muteBtn').addEventListener('click',e=>{ e.stopPropagation(); unlock(); if(!master) return;
  soundOn=!soundOn; master.gain.exponentialRampToValueAtTime(soundOn?0.55:0.0001,actx.currentTime+0.15);
  $('muteBtn').textContent=soundOn?'🔊':'🔇'; });

$('introIcon').innerHTML = APP_ICON;
T(()=>$('introIcon').classList.add('in'),150);
T(()=>$('introH').classList.add('in'),350);
T(()=>$('introSub').classList.add('in'),700);
T(()=>$('startBtn').classList.add('show'),1200);
T(dismissIntro,5000);
